<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仓库管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginView" class="login-view hidden">
  <form id="loginForm" class="login-panel">
    <div>
      <p class="eyebrow">Warehouse</p>
      <h1>仓库管理系统</h1>
    </div>
    <label>姓名全拼<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">登录</button>
    <p id="loginError" class="form-error"></p>
  </form>
</div>

<div id="appView" class="app-shell hidden">
  <aside class="sidebar">
    <div id="projectSelectWrap" class="brand-workspace">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span class="brand-copy">
          <strong>仓库管理</strong>
          <button id="projectSelect" class="project-switcher hidden" type="button"
            aria-haspopup="listbox" aria-expanded="false" title="切换项目"
            aria-label="切换项目">
            <span id="projectSwitcherName">请选择项目</span>
            <span class="switcher-arrow" aria-hidden="true">▾</span>
          </button>
        </span>
      </div>
      <div id="projectMenu" class="project-menu hidden">
        <div class="project-menu-head">
          <span>切换项目</span>
          <span id="projectCount">0 个</span>
        </div>
        <div id="projectMenuList" class="project-menu-list" role="listbox" aria-label="项目列表"></div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-user">
      <span id="userAvatar" class="user-avatar"></span>
      <span class="user-copy">
        <strong id="userName"></strong>
        <span id="userRole"></span>
      </span>
      <div class="sidebar-actions">
        <button id="passwordButton" class="btn ghost small" type="button">修改密码</button>
        <button id="logoutButton" class="btn ghost small" type="button">退出</button>
      </div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h2 id="pageTitle">工作台</h2>
    </header>
    <section id="page"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="printArea" class="print-area"></div>
<script src="app.js"></script>
</body>
</html>
