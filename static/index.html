<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仓库管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginView" class="login-view hidden">
  <form id="loginForm" class="login-panel">
    <div>
      <p class="eyebrow">Warehouse</p>
      <h1>仓库管理系统</h1>
    </div>
    <label>姓名全拼<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">登录</button>
    <p id="loginError" class="form-error"></p>
  </form>
</div>

<div id="appView" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand">仓库管理</div>
    <nav id="nav"></nav>
    <div class="sidebar-user">
      <strong id="userName"></strong>
      <span id="userRole"></span>
    </div>
    <button id="logoutButton" class="btn ghost">退出</button>
  </aside>
  <main>
    <header class="topbar">
      <h2 id="pageTitle">工作台</h2>
      <div class="top-actions">
        <select id="projectSelect" class="hidden"></select>
        <button class="btn" data-page="password">修改密码</button>
      </div>
    </header>
    <section id="page"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="printArea" class="print-area"></div>
<script src="app.js"></script>
</body>
</html>
