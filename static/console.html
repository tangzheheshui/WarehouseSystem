<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万顺WMS控制台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginView" class="login-view hidden">
  <form id="loginForm" class="login-panel">
    <div>
      <p class="eyebrow">Wanshun Console</p>
      <h1>万顺WMS控制台</h1>
      <p class="login-company">公司租户管理平台</p>
    </div>
    <label>登录名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">登录</button>
    <p id="loginError" class="form-error"></p>
  </form>
</div>

<div id="appView" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand-workspace">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span class="brand-copy">
          <strong>万顺控制台</strong>
          <span class="console-sub">公司租户管理</span>
        </span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-user">
      <span id="userAvatar" class="user-avatar"></span>
      <span class="user-copy">
        <strong id="userName"></strong>
        <span>平台管理员</span>
      </span>
      <div class="sidebar-actions">
        <button id="passwordButton" class="btn ghost small" type="button">修改密码</button>
        <button id="logoutButton" class="btn ghost small" type="button">退出</button>
      </div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h2 id="pageTitle">公司管理</h2>
    </header>
    <section id="page"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script src="console.js"></script>
</body>
</html>
